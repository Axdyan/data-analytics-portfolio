# Every figure quoted in 04-wind-repowering/README.md and memo/findings.md, with the
# query that reads it back from the tables the notebook builds, or the printed output
# it comes from. Measured on the 2026-09-03 pull; the bootstrap standard errors, interval
# bounds, pre-trend test and after-the-fact minimum detectable effect re-measured on
# 2026-09-09 from a hand run top to bottom on a byte-identical re-pull. Interval bounds the
# memo derived from the three-decimal log table are checked with a tolerance of one tenth
# of a point.
project: 04-wind-repowering
label: "04: Wind Repowering Uplift"
notebook: 04_load_explore.ipynb
database: uswtdb.duckdb
measured_on: 2026-09-09
cell_timeout_s: 7200

sources:
  - id: uswtdb_current
    refresh: reissued several times a year by USGS; the API serves the current release
    policy: uswtdb_current
    fingerprint: {kind: manifest_json, path: memo/pull_manifest.json, value: sha256}
  - id: uswtdb_2018_archive
    refresh: an archived release with a fixed catalogue entry
    policy: archived_release
    fingerprint: {kind: file_hashes, folder: ../data/uswtdb, files: [uswtdb_v1_0_20180419.zip]}
  - id: eia923_closed
    refresh: annual archives in their final revision, 2013 to 2024
    policy: eia923_closed_years
    fingerprint: {kind: file_hashes, folder: ../data/eia923, files: [f923_2013.zip, f923_2014.zip, f923_2015.zip, f923_2016.zip, f923_2017.zip, f923_2018.zip, f923_2019.zip, f923_2020.zip, f923_2021.zip, f923_2022.zip, f923_2023.zip, f923_2024.zip]}
  - id: eia923_provisional
    refresh: the 2025 archive, provisional until its final revision
    policy: eia923_provisional_year
    fingerprint: {kind: file_hashes, folder: ../data/eia923, files: [f923_2025.zip]}

numbers:
  # ---- the sources
  - id: turbine_fields
    quote: "The turbine database used here carries 28 fields"
    where: [README, findings]
    kind: count
    query: SELECT COUNT(*) FROM information_schema.columns WHERE table_name = 'raw_turbines_current'
    expected: 28
    sources: [uswtdb_current]
  - id: turbines
    quote: "75,727 turbines carrying a retrofit flag and a retrofit year"
    where: [README]
    kind: count
    query: SELECT COUNT(*) FROM raw_turbines_current
    expected: 75727
    sources: [uswtdb_current]
  - id: turbines_2018
    quote: "the April 2018 archived release"
    where: [README]
    kind: count
    query: SELECT COUNT(*) FROM raw_turbines_2018
    expected: 57636
    sources: [uswtdb_2018_archive]
  - id: plant_years
    quote: "14,077 plant-years"
    where: [README]
    kind: count
    query: SELECT COUNT(*) FROM fct_generation_plant_year
    expected: 14077
    sources: [eia923_closed, eia923_provisional]
  - id: gen_plants
    quote: "across 1,486 wind plants"
    where: [README]
    kind: count
    query: SELECT COUNT(DISTINCT plant_id) FROM fct_generation_plant_year
    expected: 1486
    sources: [eia923_closed, eia923_provisional]
  - id: gen_years
    quote: "EIA-923 plant-level generation for 2013 to 2025"
    where: [README]
    kind: text
    query: SELECT CAST(MIN(year) AS VARCHAR) || ' to ' || CAST(MAX(year) AS VARCHAR) FROM fct_generation_plant_year
    expected: "2013 to 2025"
    sources: [eia923_closed, eia923_provisional]
  - id: retrofitted_turbines
    quote: "8,480 repowered turbines"
    where: [findings]
    kind: count
    query: SELECT COUNT(*) FROM fct_turbine WHERE retrofitted
    expected: 8480
    sources: [uswtdb_current]
  - id: rewritten_turbines
    quote: "On 1,529 repowered turbines the build year has been silently rewritten"
    where: [README, findings]
    kind: count
    query: SELECT failing_rows FROM dq_assertions WHERE id = 'B5'
    expected: 1529
    sources: [uswtdb_current]
  - id: rewritten_plants
    quote: "spread across 17 plants"
    where: [findings]
    kind: count
    query: SELECT COUNT(DISTINCT plant_id) FROM fct_turbine WHERE build_year_rewritten
    expected: 17
    sources: [uswtdb_current]
  - id: rewritten_treated_plants
    quote: "Thirteen of the 17 affected plants are in the treatment group"
    where: [findings]
    kind: count
    query: SELECT COUNT(*) FROM plant_scope WHERE status = 'treated' AND build_year_rewritten
    expected: 13
    sources: [uswtdb_current]
  - id: vintage_window
    quote: "which gives 2001 to 2012"
    where: [findings]
    kind: text
    query: SELECT CAST(MIN(vintage_lo) AS VARCHAR) || ' to ' || CAST(MAX(vintage_hi) AS VARCHAR) FROM plant_scope
    expected: "2001 to 2012"
    sources: [uswtdb_current]
  - id: window_would_stretch
    quote: "the window would have stretched to 2024"
    where: [findings]
    kind: count
    query: SELECT MAX(first_p_year) FROM plant_scope WHERE status = 'treated'
    expected: 2024
    sources: [uswtdb_current]
  - id: controls_in_window
    quote: "567 of the 1,208 never-repowered plants fall inside it"
    where: [findings]
    kind: count
    query: SELECT COUNT(*) FROM plant_scope WHERE status = 'control' AND control_eligible
    expected: 567
    sources: [uswtdb_current]
  - id: never_repowered
    quote: "1,208 never-repowered plants"
    where: [findings]
    kind: count
    query: SELECT COUNT(*) FROM plant_scope WHERE status = 'control'
    expected: 1208
    sources: [uswtdb_current]
  - id: bridge_by_id_pct
    quote: "only 10.5% of them can be found in the 2018 release by id"
    where: [findings]
    kind: pct
    query: SELECT ROUND(100.0 * COUNT(r.case_id) / COUNT(*), 1) FROM fct_turbine t LEFT JOIN raw_turbines_2018 r ON TRY_CAST(r.case_id AS BIGINT) = t.case_id WHERE t.retrofitted
    expected: 10.5
    sources: [uswtdb_current, uswtdb_2018_archive]
  - id: bridge_by_id_zero_years
    quote: "for four of the nine cohort years the figure is zero"
    where: [findings]
    kind: count
    query: SELECT COUNT(*) FILTER (WHERE found = 0) FROM (SELECT t.retrofit_year, COUNT(r.case_id) AS found FROM fct_turbine t LEFT JOIN raw_turbines_2018 r ON TRY_CAST(r.case_id AS BIGINT) = t.case_id WHERE t.retrofitted GROUP BY 1)
    expected: 4
    sources: [uswtdb_current, uswtdb_2018_archive]
  - id: bridge_cohort_years
    quote: "the nine cohort years"
    where: [findings]
    kind: count
    query: SELECT COUNT(DISTINCT retrofit_year) FROM fct_turbine WHERE retrofitted
    expected: 9
    sources: [uswtdb_current]
  - id: bridge_by_project_pct
    quote: "The project id survives and bridges 92.2%"
    where: [findings]
    kind: pct
    query: SELECT ROUND(100.0 * COUNT(c.plant_id) / COUNT(*), 1) FROM plant_scope s LEFT JOIN plant_cap_2018 c USING (plant_id) WHERE s.status = 'treated'
    expected: 92.2
    sources: [uswtdb_current, uswtdb_2018_archive]
  - id: no_plant_id_turbines
    quote: "turbine with no plant id: 3,615"
    where: [findings]
    kind: count
    query: SELECT failing_rows FROM dq_assertions WHERE id = 'B2'
    expected: 3615
    sources: [uswtdb_current]
  - id: no_plant_id_pct
    quote: "The 4.8% of turbines with no plant id"
    where: [findings]
    kind: pct
    query: SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE plant_id IS NULL) / COUNT(*), 1) FROM fct_turbine
    expected: 4.8
    sources: [uswtdb_current]
  - id: no_plant_id_capacity_pct
    quote: "excluded; 2.4% of capacity"
    where: [findings]
    kind: pct
    query: SELECT ROUND(100.0 * SUM(t_cap_kw) FILTER (WHERE plant_id IS NULL) / SUM(t_cap_kw), 1) FROM fct_turbine
    expected: 2.4
    sources: [uswtdb_current]
  - id: filed_2024
    quote: "1,348 filed in 2024"
    where: [findings]
    kind: count
