    kind: count
    query: SELECT COUNT(*) FROM (SELECT plant_id FROM fct_generation_plant_year WHERE year = 2024 EXCEPT SELECT plant_id FROM fct_generation_plant_year WHERE year = 2025)
    expected: 754
    sources: [eia923_closed, eia923_provisional]
