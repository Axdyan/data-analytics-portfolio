  - id: cf_treated_weighted
    quote: "a capacity factor of 0.347 for treated plants on capacity-weighted terms"
    where: [findings]
    kind: ratio
    print_match: {pattern: 'treated\s+\d+\s+[0-9.]+\s+[0-9.]+\s+([0-9.]+)', cell: 68}
    expected: 0.347
    sources: [uswtdb_current, uswtdb_2018_archive, eia923_closed]
  - id: cf_control_weighted
    quote: "against 0.326 for controls"
    where: [findings]
    kind: ratio
    print_match: {pattern: 'control\s+\d+\s+[0-9.]+\s+[0-9.]+\s+([0-9.]+)', cell: 68}
    expected: 0.326
