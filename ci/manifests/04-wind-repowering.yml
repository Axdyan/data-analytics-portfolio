  - id: capacity_points
    quote: "Roughly 8.7 points of any generation uplift is more machine"
    where: [README, findings]
    kind: pct
    query: SELECT ROUND((SELECT 100.0 * (AVG(s.total_cap_mw) / AVG(c.cap_mw_2018) - 1) FROM plant_cap_2018 c JOIN plant_scope s USING (plant_id) WHERE s.status = 'treated') - (SELECT 100.0 * (AVG(s.total_cap_mw) / AVG(c.cap_mw_2018) - 1) FROM plant_cap_2018 c JOIN plant_scope s USING (plant_id) WHERE s.status = 'control' AND s.control_eligible), 1)
    expected: 8.7
    note: the README rounds it to nine points
    sources: [uswtdb_current, uswtdb_2018_archive]
