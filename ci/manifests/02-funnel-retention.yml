# Every figure quoted in 02-funnel-retention/README.md and memo/findings.md, with the
# query that reads it back from the views the notebook builds over the clickstream CSVs.
project: 02-funnel-retention
label: "02: Funnel and Retention"
notebook: 02_load_explore.ipynb
database: cosmetics.duckdb
measured_on: 2026-08-25
cell_timeout_s: 3600

sources:
  - id: cosmetics_kaggle
    kind: kaggle
    dataset: mkechinov/ecommerce-events-history-in-cosmetics-shop
    folder: ../data/cosmetics
    files: [2019-Oct.csv, 2019-Nov.csv, 2019-Dec.csv, 2020-Jan.csv, 2020-Feb.csv]
    refresh: a static Kaggle dataset, unchanged since 2020
    policy: static_dataset
    fingerprint: {kind: file_sizes, folder: ../data/cosmetics, files: [2019-Oct.csv, 2019-Nov.csv, 2019-Dec.csv, 2020-Jan.csv, 2020-Feb.csv]}

numbers:
  # ---- the events
  - id: events
    quote: "about 20.7 million events"
    where: [README, findings]
    kind: count
    query: SELECT COUNT(*) FROM events
    expected: 20692840
    sources: [cosmetics_kaggle]
  - id: months
    quote: "across 5 months"
    where: [README, findings]
    kind: count
    query: SELECT COUNT(DISTINCT DATE_TRUNC('month', event_time)) FROM events
    expected: 5
    sources: [cosmetics_kaggle]
  - id: span
    quote: "October 2019 to February 2020"
    where: [README, findings]
    kind: text
    query: SELECT STRFTIME(MIN(event_time), '%Y-%m') || ' to ' || STRFTIME(MAX(event_time), '%Y-%m') FROM events
    expected: "2019-10 to 2020-02"
    sources: [cosmetics_kaggle]
  # ---- the funnel
  - id: sessions_with_view_pct
    quote: "94.4% of sessions include at least one view event"
    where: [findings]
    kind: pct
    query: SELECT ROUND(100.0 * sessions_with_view / total_sessions, 1) FROM session_funnel_counts
    expected: 94.4
    sources: [cosmetics_kaggle]
  - id: sessions_with_cart_pct
    quote: "only 21.7% of sessions ever add anything to a cart"
    where: [findings]
    kind: pct
    query: SELECT ROUND(100.0 * sessions_with_cart / total_sessions, 1) FROM session_funnel_counts
    expected: 21.7
    sources: [cosmetics_kaggle]
  - id: sessions_with_purchase_pct
    quote: "21.7% down to 3.4% overall"
    where: [findings]
    kind: pct
    query: SELECT ROUND(100.0 * sessions_with_purchase / total_sessions, 1) FROM session_funnel_counts
    expected: 3.4
    sources: [cosmetics_kaggle]
  - id: view_without_cart_pct
    quote: "two-thirds of sessions that view a product never add anything to a cart"
    where: [README, findings]
    kind: pct
    query: SELECT ROUND(100.0 * (1 - sessions_with_cart * 1.0 / sessions_with_view), 1) FROM session_funnel_counts
    expected: 77.0
    note: the README says two-thirds and the memo says close to three out of four; the table says 77.0% of viewing sessions never cart
    sources: [cosmetics_kaggle]
  - id: cart_to_purchase
    quote: "about 1 in 6 carting sessions converting"
    where: [README, findings]
    kind: ratio
    query: SELECT ROUND(sessions_with_cart * 1.0 / sessions_with_purchase) FROM session_funnel_counts
    expected: 6
    sources: [cosmetics_kaggle]
  # ---- retention
  - id: purchasers
    quote: "the 110,518 purchasers in this data"
    where: [findings]
    kind: count
    query: SELECT COUNT(*) FROM purchaser_cohorts
    expected: 110518
    sources: [cosmetics_kaggle]
  - id: repeat_pct
    quote: "16.0% of the 110,518 purchasers bought again in a different calendar month"
    where: [findings]
    kind: pct
    query: SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE months > 1) / COUNT(*), 1) FROM (SELECT user_id, COUNT(DISTINCT DATE_TRUNC('month', event_time)) AS months FROM events WHERE event_type = 'purchase' GROUP BY 1)
    expected: 16.0
    sources: [cosmetics_kaggle]
  - id: retention_m1_2019-10
    quote: "Month-1 retention for the 2019-10 cohort is 18.5%"
    where: [README, findings]
    kind: pct
    query: SELECT retention_pct FROM cohort_retention_pct WHERE cohort_month = DATE '2019-10-01' AND month_offset = 1
    expected: 18.5
    sources: [cosmetics_kaggle]
  - id: retention_m1_2019-11
    quote: "Month-1 retention for the 2019-11 cohort is 9.8%"
    where: [findings]
    kind: pct
    query: SELECT retention_pct FROM cohort_retention_pct WHERE cohort_month = DATE '2019-11-01' AND month_offset = 1
    expected: 9.8
    sources: [cosmetics_kaggle]
  - id: retention_m1_2019-12
    quote: "Month-1 retention for the 2019-12 cohort is 8.5%"
    where: [findings]
    kind: pct
    query: SELECT retention_pct FROM cohort_retention_pct WHERE cohort_month = DATE '2019-12-01' AND month_offset = 1
    expected: 8.5
    sources: [cosmetics_kaggle]
  - id: retention_m1_2020-01
    quote: "Month-1 retention for the 2020-01 cohort is 8.9%"
    where: [findings]
    kind: pct
    query: SELECT retention_pct FROM cohort_retention_pct WHERE cohort_month = DATE '2020-01-01' AND month_offset = 1
    expected: 8.9
    sources: [cosmetics_kaggle]
  - id: october_uptick
    quote: "a small uptick at month 3 that the other cohorts do not show"
    where: [findings]
    kind: pct
    query: SELECT (SELECT retention_pct FROM cohort_retention_pct WHERE cohort_month = DATE '2019-10-01' AND month_offset = 3) - (SELECT retention_pct FROM cohort_retention_pct WHERE cohort_month = DATE '2019-10-01' AND month_offset = 2)
    expected: 0
    compare: gt
    sources: [cosmetics_kaggle]
  - id: floor_low
    quote: "a flat floor around 8 to 10% for everyone after it: the low end"
    where: [findings]
    kind: pct
    query: SELECT MIN(retention_pct) FROM cohort_retention_pct WHERE cohort_month > DATE '2019-10-01' AND month_offset = 1
    expected: 8.5
    sources: [cosmetics_kaggle]
  - id: floor_high
    quote: "the high end"
    where: [findings]
    kind: pct
    query: SELECT MAX(retention_pct) FROM cohort_retention_pct WHERE cohort_month > DATE '2019-10-01' AND month_offset = 1
    expected: 9.8
    sources: [cosmetics_kaggle]
  # ---- cart value
  - id: cart_unconverted
    quote: "$23,993,092 belongs to sessions that never bought anything"
    where: [README, findings]
    kind: money
    query: SELECT ROUND(SUM(cart_value)) FROM session_cart_value WHERE purchased = 0
    expected: 23993092
    sources: [cosmetics_kaggle]
  - id: cart_total
    quote: "of $29,863,849 in cart value"
    where: [README, findings]
    kind: money
    query: SELECT ROUND(SUM(cart_value)) FROM session_cart_value
    expected: 29863849
    sources: [cosmetics_kaggle]
  - id: cart_unconverted_pct
    quote: "80.3%"
    where: [README, findings]
    kind: pct
    query: SELECT ROUND(100.0 * SUM(cart_value) FILTER (WHERE purchased = 0) / SUM(cart_value), 1) FROM session_cart_value
    expected: 80.3
    sources: [cosmetics_kaggle]
  - id: purchase_revenue
    quote: "Actual purchase revenue over the same period comes to $6,348,005"
    where: [findings]
    kind: money
    query: SELECT ROUND(SUM(price)) FROM events WHERE event_type = 'purchase'
    expected: 6348005
    sources: [cosmetics_kaggle]
  - id: revenue_exceeds_cart
    quote: "a bit higher than the cart value tied to purchasing sessions"
    where: [findings]
    kind: money
    query: SELECT (SELECT SUM(price) FROM events WHERE event_type = 'purchase') - (SELECT SUM(cart_value) FROM session_cart_value WHERE purchased = 1)
    expected: 0
    compare: gt
    sources: [cosmetics_kaggle]
