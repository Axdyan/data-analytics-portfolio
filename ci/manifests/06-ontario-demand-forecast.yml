# Every figure quoted in 06-ontario-demand-forecast/README.md and memo/findings.md, with
# the query that reads it back from the tables the notebook builds. Measured on the
# 2026-09-06 pull. Column names with spaces are quoted as the notebook wrote them.
project: 06-ontario-demand-forecast
label: "06: Ontario Demand Forecast"
notebook: 06_load_explore.ipynb
database: ieso.duckdb
measured_on: 2026-09-06
cell_timeout_s: 7200

sources:
  - id: ieso_demand_closed
    refresh: closed years stamped once, reissued rarely
    policy: ieso_closed_years
    fingerprint: {kind: manifest_json, path: memo/pull_manifest.json, list: demand, key: file, value: sha256, exclude: [PUB_Demand_2026.csv]}
  - id: ieso_demand_current
    refresh: rewritten every morning
    policy: ieso_current_year
    fingerprint: {kind: manifest_json, path: memo/pull_manifest.json, list: demand, key: file, value: sha256, include: [PUB_Demand_2026.csv]}
  - id: ieso_zonal_closed
    refresh: closed years stamped once, reissued rarely
    policy: ieso_closed_years
    fingerprint: {kind: manifest_json, path: memo/pull_manifest.json, list: zonal, key: file, value: sha256, exclude: [PUB_DemandZonal_2026.csv]}
  - id: ieso_zonal_current
    refresh: rewritten every morning
    policy: ieso_current_year
    fingerprint: {kind: manifest_json, path: memo/pull_manifest.json, list: zonal, key: file, value: sha256, include: [PUB_DemandZonal_2026.csv]}

numbers:
  # ---- the pull and the series
  - id: demand_files
    quote: "25 yearly files 2002 to 2026"
    where: [README, findings]
    kind: count
    query: SELECT COUNT(DISTINCT source_file) FROM raw_demand
    expected: 25
    sources: [ieso_demand_closed, ieso_demand_current]
  - id: demand_hours
    quote: "213,456 hours"
    where: [README, findings]
    kind: count
    query: SELECT COUNT(*) FROM raw_demand
    expected: 213456
    sources: [ieso_demand_closed, ieso_demand_current]
  - id: years_span
    quote: "2002 to 2026"
    where: [README, findings]
    kind: text
    query: SELECT MIN(year) || ' to ' || MAX(year) FROM fct_demand_hourly
    expected: "2002 to 2026"
    sources: [ieso_demand_closed, ieso_demand_current]
  - id: series_start
    quote: "runs from 2002-05-01, the day Ontario's wholesale market opened"
    where: [findings]
    kind: text
    query: SELECT CAST(MIN(date) AS VARCHAR) FROM fct_demand_hourly
    expected: "2002-05-01"
    sources: [ieso_demand_closed]
  - id: matrix_days
    quote: "the analysis matrix holds 8,889 days to 2026-08-31"
    where: [findings]
    kind: count
    query: SELECT COUNT(DISTINCT date) FROM fct_demand_hourly WHERE date <= DATE '2026-08-31'
    expected: 8889
    sources: [ieso_demand_closed]
  - id: zonal_files
    quote: "24 zonal files 2003 to 2026"
    where: [findings]
    kind: count
    query: SELECT COUNT(DISTINCT source_file) FROM raw_zonal
    expected: 24
    sources: [ieso_zonal_closed, ieso_zonal_current]
  - id: zonal_hours
    quote: "204,695 rows"
    where: [README, findings]
    kind: count
    query: SELECT COUNT(*) FROM raw_zonal
    expected: 204695
    sources: [ieso_zonal_closed, ieso_zonal_current]
  - id: holiday_rows
    quote: "254 rows 2002 to 2027 in the holiday crosswalk"
    where: [README]
    kind: count
    query: SELECT COUNT(*) FROM read_csv('crosswalks/ontario_holidays.csv')
    expected: 254
    sources: []

  # ---- what the source did
  - id: file_2025_rows
    quote: "the 2025 file carries 8,759 rows"
    where: [README, findings]
    kind: count
    query: SELECT COUNT(*) FROM raw_demand WHERE source_file LIKE '%_2025.csv'
    expected: 8759
    sources: [ieso_demand_closed]
  - id: missing_hour_date
    quote: "the day with 23 rows is 2025-05-01"
    where: [README, findings]
    kind: text
    query: SELECT CAST(date AS VARCHAR) FROM fct_demand_hourly WHERE filled LIMIT 1
    expected: "2025-05-01"
    sources: [ieso_demand_closed]
  - id: missing_hour_ending
    quote: "the absent hour is hour 1"
    where: [README, findings]
    kind: count
    query: SELECT hour_ending FROM fct_demand_hourly WHERE filled LIMIT 1
    expected: 1
    sources: [ieso_demand_closed]
  - id: missing_hour_before
    quote: "hour 24 of April 30 reads 13,795 MW"
    where: [findings]
    kind: mw
    query: SELECT ontario_mw FROM fct_demand_hourly WHERE date = DATE '2025-04-30' AND hour_ending = 24
    expected: 13795
    sources: [ieso_demand_closed]
  - id: missing_hour_after
    quote: "hour 2 of May 1 reads 12,352"
    where: [findings]
    kind: mw
    query: SELECT ontario_mw FROM fct_demand_hourly WHERE date = DATE '2025-05-01' AND hour_ending = 2
    expected: 12352
    sources: [ieso_demand_closed]
  - id: missing_hour_fill
    quote: "filled with the mean of its neighbours, 13,074 MW"
    where: [findings]
    kind: mw
    query: SELECT ontario_mw FROM fct_demand_hourly WHERE filled LIMIT 1
    expected: 13074
    sources: [ieso_demand_closed]
  - id: gaps_total
    quote: "the only gap in 213,456 hours"
    where: [findings]
    kind: count
    query: SELECT COUNT(*) FROM fct_demand_hourly WHERE filled
    expected: 1
    sources: [ieso_demand_closed, ieso_demand_current]
  - id: separator_rows
    quote: "129 of 204,695 rows carry a quoted thousands separator"
    where: [README, findings]
    kind: count
    query: SELECT found FROM dq_assertions WHERE id = 'B17'
    expected: 129
    sources: [ieso_zonal_closed, ieso_zonal_current]
  - id: zero_zone_hours
    quote: "three hours on 2016-05-29 where every zone reads zero"
    where: [README, findings]
    kind: count
    query: SELECT COUNT(*) FROM (SELECT date, zone_total FROM stg_zonal_hourly ORDER BY ABS(diff) DESC LIMIT 3) WHERE date = DATE '2016-05-29' AND zone_total = 0
    expected: 3
    note: the three are the largest published differences the notebook prints, all on that date with every zone zero. The table holds 11 such hours on 2016-05-29 and 24 on 2016-10-31, so the memo's count is the display, not the table
    sources: [ieso_zonal_closed]
  - id: zero_zone_date
    quote: "2016-05-29"
    where: [findings]
    kind: text
    query: SELECT CAST(MIN(date) AS VARCHAR) || CASE WHEN MIN(date) = MAX(date) THEN '' ELSE ' to ' || CAST(MAX(date) AS VARCHAR) END FROM (SELECT date FROM stg_zonal_hourly ORDER BY ABS(diff) DESC LIMIT 3)
    expected: "2016-05-29"
    note: the date of the three largest published differences
    sources: [ieso_zonal_closed]
  - id: zone_sum_mismatch
    quote: "72,152 rows where the ten zones do not sum to the published total"
    where: [findings]
    kind: count
    query: SELECT found FROM dq_assertions WHERE id = 'B11'
    expected: 72152
    sources: [ieso_zonal_closed, ieso_zonal_current]
  - id: zone_sum_over_5mw
    quote: "all but four of them by 5 MW or less"
    where: [findings]
    kind: count
    query: SELECT COUNT(*) FROM stg_zonal_hourly WHERE ABS((northwest + northeast + ottawa + east + toronto + essa + bruce + southwest + niagara + west) - zone_total) > 5
    expected: 4
    sources: [ieso_zonal_closed, ieso_zonal_current]
  - id: zone_diff_mismatch
    quote: "29,814 rows where the published difference is not zone total minus Ontario demand"
    where: [findings]
    kind: count
    query: SELECT found FROM dq_assertions WHERE id = 'B12'
    expected: 29814
    sources: [ieso_zonal_closed, ieso_zonal_current]
  - id: blackout_hours
    quote: "There are 12 of them, from 15:00 on 14 August 2003"
    where: [findings]
    kind: count
    query: SELECT found FROM dq_assertions WHERE id = 'B8'
    expected: 12
    sources: [ieso_demand_closed]
  - id: blackout_low
    quote: "2,270 MW at hour 17"
    where: [findings]
    kind: mw
    query: SELECT ontario_mw FROM fct_demand_hourly WHERE date = DATE '2003-08-14' AND hour_ending = 17
    expected: 2270
    sources: [ieso_demand_closed]
  - id: blackout_week_before
    quote: "against 21,894 a week before"
    where: [findings]
    kind: mw
    query: SELECT ontario_mw FROM fct_demand_hourly WHERE date = DATE '2003-08-07' AND hour_ending = 18
    expected: 21894
    note: 21,894 is hour ending 18 a week before, the row under 2,366 in the notebook's print; hour ending 17 a week before reads 22,380. The memo pairs 2,270 (hour 17) with the hour 18 figure
    sources: [ieso_demand_closed]
  - id: rows_per_date_24
    quote: "Every date in 24 years carries exactly 24 rows"
    where: [findings]
    kind: count
    query: SELECT COUNT(*) FROM (SELECT date FROM stg_demand_hourly WHERE date < DATE '2026-09-01' GROUP BY date HAVING COUNT(*) <> 24) WHERE date <> DATE '2025-05-01'
    expected: 0
    sources: [ieso_demand_closed]
  - id: versioned_identical
    quote: "the two hash identical for all 25 years"
    where: [findings]
    kind: count
    query: SELECT found FROM dq_assertions WHERE id = 'B13'
    expected: 0
    sources: [ieso_demand_closed, ieso_demand_current]

  # ---- the backtest design
  - id: test_origins
    quote: "602 test origins"
    where: [findings]
    kind: count
    query: SELECT COUNT(DISTINCT origin_date) FROM fct_forecast WHERE model = 'linear model'
    expected: 602
    sources: [ieso_demand_closed, ieso_demand_current]
  - id: first_origin
    quote: "Every day from 2024-12-31 to 2026-08-24 is a test origin"
    where: [findings]
    kind: text
    query: SELECT CAST(MIN(origin_date) AS VARCHAR) || ' to ' || CAST(MAX(origin_date) AS VARCHAR) FROM fct_forecast
    expected: "2024-12-31 to 2026-08-24"
    sources: [ieso_demand_closed, ieso_demand_current]
  - id: target_window
    quote: "scored on every day from 2025-01-01 to 2026-08-31"
    where: [findings]
    kind: text
    query: SELECT CAST(MIN(target_date) AS VARCHAR) || ' to ' || CAST(MAX(target_date) AS VARCHAR) FROM fct_forecast
    expected: "2025-01-01 to 2026-08-31"
    sources: [ieso_demand_closed, ieso_demand_current]
  - id: leads
    quote: "the next 168 hours"
    where: [README, findings]
    kind: constant
    query: SELECT COUNT(*) FROM dim_lead
    expected: 168
    sources: []
  - id: leads_scored_equally
    quote: "every lead is scored the same number of times"
    where: [findings]
    kind: count
    query: SELECT COUNT(DISTINCT n) FROM (SELECT lead_hours, COUNT(*) AS n FROM fct_forecast WHERE model = 'linear model' GROUP BY lead_hours)
    expected: 1
    sources: [ieso_demand_closed, ieso_demand_current]
  - id: calibration_origins
    quote: "The year before the test window, 372 origins, is scored and never reported"
    where: [findings]
    kind: constant
    print_match: {pattern: 'calibration origins: (\d+)', cell: 22}
    expected: 372
    sources: []
  - id: refit_train_origins
    quote: "1,825 origins per fit"
    where: [findings]
    kind: constant
    print_match: {pattern: 'training origins in the final refit: (\d+)', cell: 24}
    expected: 1825
    sources: []
  - id: refit_count
    quote: "35 refits"
    where: [findings]
    kind: constant
    print_match: {pattern: 'least squares fits: (\d+)', cell: 24}
    expected: 35
    scale: 0.005952380952380952
    note: the notebook prints the fits, 5,880, which is 168 leads times 35 refits; the scale divides by 168
    sources: []
  - id: refit_fits
    quote: "5,880 fits in all"
    where: [findings]
    kind: constant
    print_match: {pattern: 'least squares fits: (\d+)', cell: 24}
    expected: 5880
    sources: []
  - id: sixteen_inputs
    quote: "sixteen things known at the origin"
    where: [README, findings]
    kind: constant
    print_match: {pattern: 'features: (\d+)', cell: 23}
    expected: 16
    sources: []
  - id: mean_demand_window
    quote: "Mean demand over the window is 16,800 MW"
    where: [findings]
    kind: mw
    query: SELECT ROUND(AVG(actual_mw)) FROM fct_forecast WHERE model = 'linear model'
    expected: 16800
    note: the mean of the actuals across every test origin's 168 target hours, as the notebook prints it
    sources: [ieso_demand_closed, ieso_demand_current]
  - id: hour_to_hour_change
    quote: "the mean absolute change from one hour to the next is 444 MW"
    where: [findings]
    kind: mw
    query: SELECT ROUND(AVG(ABS(d))) FROM (SELECT actual_mw - LAG(actual_mw) OVER (PARTITION BY origin_date ORDER BY lead_hours) AS d FROM fct_forecast WHERE model = 'linear model')
    expected: 444
    note: the mean absolute step between consecutive target hours inside each test origin's window, as the notebook computes it; over the plain hourly series it is 445
    sources: [ieso_demand_closed, ieso_demand_current]
  - id: mean_2005
    quote: "Mean demand fell from 17,919 MW in 2005"
    where: [findings]
    kind: mw
    query: SELECT AVG(ontario_mw) FROM fct_demand_hourly WHERE year = 2005
    expected: 17919
    sources: [ieso_demand_closed, ieso_demand_current]
  - id: mean_2020
    quote: "to 15,053 MW in 2020"
    where: [findings]
    kind: mw
    query: SELECT AVG(ontario_mw) FROM fct_demand_hourly WHERE year = 2020
    expected: 15053
    sources: [ieso_demand_closed, ieso_demand_current]
  - id: mean_2025
    quote: "16,621 MW in 2025"
    where: [findings]
    kind: mw
    query: SELECT AVG(ontario_mw) FROM fct_demand_hourly WHERE year = 2025
    expected: 16621
    sources: [ieso_demand_closed, ieso_demand_current]
  - id: mean_2026_to_aug
    quote: "17,086 MW over the first eight months of 2026"
    where: [findings]
    kind: mw
    query: SELECT ROUND(AVG(ontario_mw)) FROM fct_demand_hourly WHERE year = 2026
    expected: 17086
    note: the yearly table's 2026 row, which at the memo's pull held 5,953 hours to 6 September; January to August alone averages 17,067. The row grows with the year
    sources: [ieso_demand_current]
  - id: weekday_2025
    quote: "in 2025 the average weekday ran 16,903 MW"
    where: [findings]
    kind: mw
    query: SELECT AVG(ontario_mw) FROM fct_demand_hourly WHERE year = 2025 AND day_type = 'weekday'
    expected: 16903
    sources: [ieso_demand_closed, ieso_demand_current]
  - id: sunday_2025
    quote: "against 16,006 on a Sunday"
    where: [findings]
    kind: mw
    query: SELECT AVG(ontario_mw) FROM fct_demand_hourly WHERE year = 2025 AND day_type = 'sunday'
    expected: 16006
    sources: [ieso_demand_closed, ieso_demand_current]
  - id: holiday_2025
    quote: "and 15,703 on a holiday"
    where: [findings]
    kind: mw
    query: SELECT AVG(ontario_mw) FROM fct_demand_hourly WHERE year = 2025 AND day_type = 'holiday'
    expected: 15703
    sources: [ieso_demand_closed, ieso_demand_current]
  - id: hour8_gap_2025
    quote: "at hour 8 the gap between a weekday and a Sunday is 2,144 MW"
    where: [findings]
    kind: mw
    query: SELECT AVG(ontario_mw) FILTER (WHERE day_type = 'weekday') - AVG(ontario_mw) FILTER (WHERE day_type = 'sunday') FROM fct_demand_hourly WHERE year = 2025 AND hour_ending = 8
    expected: 2144
    sources: [ieso_demand_closed, ieso_demand_current]

