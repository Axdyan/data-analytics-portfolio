# Every figure quoted in 03-defence-procurement/README.md and memo/findings.md, with
# the query that reads it back from the tables the notebook builds, or the printed
# output it comes from. Measured on the 2026-09-03 pull, unchanged on 2026-09-04.
project: 03-defence-procurement
label: "03: Defence Procurement Intelligence"
notebook: 03_load_explore.ipynb
database: canadabuys.duckdb
measured_on: 2026-09-04
cell_timeout_s: 3600

sources:
  - id: canadabuys_history
    refresh: monthly by the publisher's statement, weekly observed
    policy: canadabuys_history
    fingerprint: {kind: manifest_json, path: memo/pull_manifest.json, value: sha256}

numbers:
  # ---- the file and its grain
  - id: rows
    quote: "21,890 rows"
    where: [README, findings]
    kind: count
    query: SELECT COUNT(*) FROM raw_contract_history
    expected: 21890
    sources: [canadabuys_history]
  - id: columns
    quote: "91 columns"
    where: [README, findings]
    kind: count
    query: SELECT COUNT(*) FROM information_schema.columns WHERE table_name = 'raw_contract_history'
    expected: 91
    sources: [canadabuys_history]
  - id: contracts
    quote: "13,296 contracts sit across 21,890 rows"
    where: [README, findings]
    kind: count
    query: SELECT COUNT(*) FROM fct_contract
    expected: 13296
    sources: [canadabuys_history]
  - id: amended_contracts
    quote: "4,314 of them have been amended at least once"
    where: [findings]
    kind: count
    query: SELECT COUNT(*) FROM fct_contract WHERE amendment_rows > 1
    expected: 4314
    sources: [canadabuys_history]
  - id: pct_goods_empty
    quote: "populated on 0 of 21,890 rows (A15)"
    where: [README, findings]
    kind: count
    query: SELECT failing_rows FROM dq_assertions WHERE id = 'A15'
    expected: 21890
    sources: [canadabuys_history]
  - id: total_varies
    quote: "A21 finds 0 that do"
    where: [findings]
    kind: count
    query: SELECT failing_rows FROM dq_assertions WHERE id = 'A21'
    expected: 0
    sources: [canadabuys_history]
  - id: naive_sum
    quote: "Naive sum over every row $132,853,897,948.13"
    where: [README, findings]
    kind: money
    query: SELECT SUM(contract_value_cad) FROM stg_contract_history WHERE contract_value_cad >= 0
    expected: 132853897948.13
    note: the one negative contract is excluded from both sums, as the memo's definitions say
    sources: [canadabuys_history]
  - id: keyed_sum
    quote: "Keyed sum, one row per contract at its latest amendment $66,363,740,301.42"
    where: [README, findings]
    kind: money
    query: SELECT SUM(contract_value_cad) FROM fct_contract WHERE contract_value_cad >= 0
    expected: 66363740301.42
    sources: [canadabuys_history]
  - id: overstatement
    quote: "Overstatement $66,490,157,646.71"
    where: [findings]
    kind: money
    query: SELECT (SELECT SUM(contract_value_cad) FROM stg_contract_history WHERE contract_value_cad >= 0) - (SELECT SUM(contract_value_cad) FROM fct_contract WHERE contract_value_cad >= 0)
    expected: 66490157646.71
    sources: [canadabuys_history]
  - id: overstatement_pct
    quote: "or 100.2%"
    where: [findings]
    kind: pct
    query: SELECT ROUND(100.0 * ((SELECT SUM(contract_value_cad) FROM stg_contract_history WHERE contract_value_cad >= 0) / (SELECT SUM(contract_value_cad) FROM fct_contract WHERE contract_value_cad >= 0) - 1), 1)
    expected: 100.2
    sources: [canadabuys_history]
  - id: max_per_contract_same
    quote: "Taking the maximum per contract happens to return the same $66,363,740,301.42"
    where: [findings]
    kind: money
    query: SELECT SUM(m) FROM (SELECT MAX(contract_value_cad) AS m FROM stg_contract_history GROUP BY reference_number) WHERE m >= 0
    expected: 66363740301.42
    sources: [canadabuys_history]
  - id: cw2340003_rows
    quote: "CW2340003 is the largest award in the defence subset, and its total appears three times"
    where: [findings]
    kind: count
    query: SELECT COUNT(*) FROM stg_contract_history WHERE reference_number = 'CW2340003'
    expected: 3
    sources: [canadabuys_history]
  - id: cw2340003_largest
    quote: "the largest award in the defence subset"
    where: [findings]
    kind: text
    query: SELECT reference_number FROM fct_contract WHERE is_dnd ORDER BY contract_value_cad DESC LIMIT 1
    expected: "CW2340003"
    sources: [canadabuys_history]
  - id: cw2340003_value
    quote: "$2,283,021,216.00 on every amendment row"
    where: [findings]
    kind: money
    query: SELECT MAX(contract_value_cad) FROM stg_contract_history WHERE reference_number = 'CW2340003'
    expected: 2283021216.0
    sources: [canadabuys_history]
  - id: cw2340003_constant
    quote: "printed unchanged on every amendment row"
    where: [findings]
    kind: count
    query: SELECT COUNT(DISTINCT contract_value_cad) FROM stg_contract_history WHERE reference_number = 'CW2340003'
    expected: 1
    sources: [canadabuys_history]
  - id: cw2340003_naive
    quote: "this one contract contributes $6.8B to a total it is worth $2.3B in"
    where: [findings]
    kind: money
    query: SELECT ROUND(SUM(contract_value_cad) / 1e9, 1) FROM stg_contract_history WHERE reference_number = 'CW2340003'
    expected: 6.8
    sources: [canadabuys_history]
  - id: cw2340003_dates
    quote: "Award date 2023-12-15 on all three rows"
    where: [findings]
    kind: text
    query: SELECT CAST(MIN(award_date) AS VARCHAR) || CASE WHEN MIN(award_date) = MAX(award_date) THEN '' ELSE ' to ' || CAST(MAX(award_date) AS VARCHAR) END FROM stg_contract_history WHERE reference_number = 'CW2340003'
    expected: "2023-12-15"
    sources: [canadabuys_history]
