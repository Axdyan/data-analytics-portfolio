version: 2

models:
  - name: int_hs10_validity
    description: >
      One row per HS10 code and validity period, numbered, with the previous period's description,
      a meaning_changed flag, and the description a join on the code alone would attach today.
      Built from the publisher's own start and end months rather than from snapshots taken here.
    columns:
      - name: hs10_period_key
        description: The code plus its opening month, YYYYMM. The key the fact table carries.
        tests: [unique, not_null]
      - name: hs10
        tests: [not_null]
      - name: version_no
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: valid_to
        tests: [not_null]

  - name: int_imports_with_validity
    description: >
      Every import row joined to the dictionary period whose validity range contains its month.
      Left join, so a code absent from the dictionary stays as unmatched. The singular tests
      assert that no row matched more than one period (C5) and count the rows that matched none (C10).

  - name: int_concordance_202201
    description: >
      The publisher's ten-digit concordance across the January 2022 break, one row per published
      pair, joined to the dictionary at both ends, with the relation the subheading-then-heading
      rule would have drawn kept as a column for comparison.
    columns:
      - name: pair_key
        tests: [unique, not_null]
      - name: obsolete_hs10
        tests: [not_null]
      - name: new_hs10
        tests: [not_null]
      - name: mechanical_relation
        tests:
          - accepted_values:
              arguments:
                values: ['same code', 'same subheading', 'same heading', 'same chapter', 'different chapter']
      - name: mapping_type
        tests:
          - accepted_values:
              arguments:
                values: ['one to one', 'split', 'merge', 'many to many']
